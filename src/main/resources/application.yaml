spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:live-klass;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: heeeun
    password:
  jpa:
    database: h2
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        order_updates: true
        order_inserts: true
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging.level:
  org.hibernate.SQL: debug
